name: Build and Deploy Laundry Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build dan jalankan container
        run: |
          docker compose down --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cek kesehatan container
        run: |
          docker compose ps

          $maxAttempts = 12
          $attempt = 0
          $healthy = $false

          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri http://localhost:8080 -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {
              Write-Host "Belum siap, mencoba lagi... (attempt $($attempt+1)/$maxAttempts)"
            }
            Start-Sleep -Seconds 5
            $attempt++
          }

          if (-not $healthy) {
            Write-Host "Container tidak sehat setelah $maxAttempts percobaan"
            docker compose logs
            exit 1
          }

          Write-Host "Container sehat!"