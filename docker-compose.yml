services:
  app:
    build: .
    image: laundry-admin:latest
    container_name: laundry-admin
    environment:
      DB_HOST: db
      DB_USER: laundry
      DB_PASSWORD: laundry_secret
      DB_NAME: laundry_db
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    container_name: laundry-mysql
    environment:
      MYSQL_DATABASE: laundry_db
      MYSQL_USER: laundry
      MYSQL_PASSWORD: laundry_secret
      MYSQL_ROOT_PASSWORD: root_secret_ganti_ini
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret_ganti_ini"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mysql_data:
